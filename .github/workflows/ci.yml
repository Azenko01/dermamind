name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dermamind
          POSTGRES_PASSWORD: dermamind
          POSTGRES_DB: dermamind
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dermamind"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # Throwaway CI database and key, not secrets.
      DATABASE_URL: postgresql://dermamind:dermamind@localhost:5432/dermamind?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dermamind/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: API e2e tests (Postgres)
        run: pnpm --filter @dermamind/api test:e2e
        env:
          TEST_DATABASE_URL: postgresql://dermamind:dermamind@localhost:5432/dermamind_test?schema=public

      - name: Migrations apply cleanly and match schema.prisma
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
